<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self' https://api.frankfurter.dev https://api.gold-api.com https://api.github.com https://github.com https://hfeptlxxphvccfjrtmkv.supabase.co wss://hfeptlxxphvccfjrtmkv.supabase.co">
  <title>Kuruşu Kuruşuna</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icon.png" alt="" class="brand-logo">
        <div class="brand-text">
          <div class="brand-name">Kuruşu Kuruşuna</div>
          <div class="brand-sub" id="brandBalance">&nbsp;</div>
        </div>
      </div>
      <div class="brand-tools">
        <button class="tool-btn" data-action="toggle-hide" title="Tutarları gizle (H)"></button>
        <button class="tool-btn lock-btn" data-action="lock-now" title="Şimdi kilitle" hidden></button>
        <button class="tool-btn sync-btn" data-action="sync-now" title="Eşitle" hidden>☁</button>
      </div>
      <nav class="nav" id="nav">
        <button data-view="ozet" class="active"><span class="ico">◧</span>Özet</button>
        <button data-view="islemler"><span class="ico">⇅</span>İşlemler</button>
        <button data-view="hesaplar"><span class="ico">▣</span>Hesaplar</button>
        <button data-view="duzenli"><span class="ico">↻</span>Düzenli Ödemeler<span class="nav-badge" id="dueBadge" hidden></span></button>
        <button data-view="birikim"><span class="ico">◎</span>Birikimler</button>
        <button data-view="varliklar"><span class="ico">◈</span>Döviz ve Altın</button>
        <button data-view="borclar"><span class="ico">⇆</span>Borç ve Alacak</button>
        <button data-view="butce"><span class="ico">▤</span>Bütçe ve Raporlar</button>
        <button data-view="ayarlar"><span class="ico">⚙</span>Ayarlar</button>
      </nav>
      <button class="upd-banner" id="updBanner" data-action="install-update" hidden></button>
      <div class="quick">
        <button class="btn btn-income" data-action="new-income">+ Gelir</button>
        <button class="btn btn-expense" data-action="new-expense">+ Gider</button>
      </div>
      <div class="hint">Kısayol: <kbd>G</kbd> gelir, <kbd>N</kbd> gider, <kbd>H</kbd> gizle</div>
    </aside>

    <!-- Telefon ekranı için üst başlık -->
    <header class="mtop">
      <img src="icon.png" alt="" class="brand-logo">
      <div class="mtop-title"><b>Kuruşu Kuruşuna</b><span id="mBalance"></span></div>
      <button class="tool-btn" data-action="toggle-hide" aria-label="Tutarları gizle"></button>
      <button class="tool-btn lock-btn" data-action="lock-now" aria-label="Kilitle" hidden></button>
      <button class="tool-btn sync-btn" data-action="sync-now" aria-label="Eşitle" hidden>☁</button>
      <button class="tool-btn" data-view="ayarlar" aria-label="Ayarlar">⚙</button>
    </header>

    <button class="upd-banner m-upd" id="mUpdBanner" data-action="install-update" hidden></button>
    <main class="main" id="main"></main>

    <!-- Telefon ekranı için alt sekmeler -->
    <nav class="tabbar">
      <button data-view="ozet"><span>◧</span>Özet</button>
      <button data-view="islemler"><span>⇅</span>İşlemler</button>
      <button data-view="hesaplar"><span>▣</span>Hesaplar</button>
      <button data-view="duzenli"><span>↻</span>Ödemeler<i class="tab-badge" id="mDueBadge" hidden></i></button>
      <button data-action="more-menu"><span>☰</span>Diğer</button>
    </nav>
    <button class="fab" data-action="quick-add" aria-label="Yeni kayıt">+</button>
  </div>

  <div class="lock" id="lock" hidden>
    <div class="lock-box">
      <img src="icon.png" alt="" class="lock-logo">
      <h2>Kuruşu Kuruşuna</h2>
      <p class="muted" id="lockHint"></p>
      <form id="lockForm" autocomplete="off">
        <input id="lockInput" class="input lock-input" type="password" autocomplete="off" enterkeyhint="go">
        <button class="btn btn-primary" type="submit">Aç</button>
      </form>
      <div class="lock-msg" id="lockMsg"></div>
      <button type="button" class="btn" id="lockBio" hidden></button>
      <button type="button" class="link" id="lockForgot">Unuttum</button>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <header class="modal-head">
        <h3 id="modalTitle"></h3>
        <button type="button" class="icon-btn" data-close aria-label="Kapat">✕</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/mobile-bridge.js"></script>
  <script src="vendor/cloud.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="extras.js"></script>
  <script src="sync.js"></script>
  <script src="boot.js"></script>
</body>
</html>
