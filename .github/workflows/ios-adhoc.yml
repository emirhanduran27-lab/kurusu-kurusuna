name: iPhone doğrudan yükleme (Ad Hoc)

# Kayıtlı iPhone'lara TestFlight olmadan yüklenebilen bir sürüm hazırlar.
# Kurulum sayfası: https://emirhanduran27-lab.github.io/kurusu-kurusuna/test/
on:
  workflow_dispatch:
    inputs:
      udid:
        description: Kaydedilecek yeni iPhone UDID'si (boş bırakılabilir)
        type: string
        default: ''
      name:
        description: Cihaz adı
        type: string
        default: iPhone

permissions:
  contents: write

jobs:
  adhoc:
    runs-on: macos-latest
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cihazı kaydet
        if: inputs.udid != ''
        shell: bash
        env:
          UDID: ${{ inputs.udid }}
          DNAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          [[ "$UDID" =~ ^[0-9A-Fa-f-]{25,40}$ ]] || { echo "::error::UDID geçersiz görünüyor"; exit 1; }
          N=$(node scripts/asc.js GET "/v1/devices?filter%5Budid%5D=$UDID" | node -pe "JSON.parse(require('fs').readFileSync(0)).data.length")
          if [ "$N" = "0" ]; then
            node scripts/asc.js POST /v1/devices "{\"data\":{\"type\":\"devices\",\"attributes\":{\"name\":\"$DNAME\",\"platform\":\"IOS\",\"udid\":\"$UDID\"}}}" > /dev/null
            echo "::notice::Cihaz kaydedildi: $DNAME"
          else
            echo "::notice::Cihaz zaten kayıtlı"
          fi

      - name: Apple ile giriş yeteneği
        shell: bash
        run: bash scripts/asc-capability.sh || echo "::warning::Apple ile giriş yeteneği açılamadı"

      - run: npm ci

      - name: Derle ve Ad Hoc olarak imzala
        shell: bash
        run: |
          set -o pipefail
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          fail() { grep -iE "error|fail|invalid|denied|unable|provision|certificate" "$1" | tail -12 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
          npx cap sync ios
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(date -u +%Y%m%d%H%M)
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER= archive > "$RUNNER_TEMP/a.log" 2>&1 || fail "$RUNNER_TEMP/a.log"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/e.log" 2>&1 || fail "$RUNNER_TEMP/e.log"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          mkdir -p x && (cd x && unzip -q "$IPA")
          APP=$(ls -d x/Payload/*.app)
          security cms -D -i "$APP/embedded.mobileprovision" > prof.plist
          echo "::notice::Profil: $(/usr/libexec/PlistBuddy -c 'Print :Name' prof.plist), cihaz sayısı $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' prof.plist | grep -c -E '^ +[0-9A-Fa-f-]{20,}')"
          mkdir -p docs/test
          cp "$IPA" docs/test/KurusuKurusuna.ipa
          cat > docs/test/manifest.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
            <key>assets</key><array>
              <dict><key>kind</key><string>software-package</string><key>url</key><string>https://emirhanduran27-lab.github.io/kurusu-kurusuna/test/KurusuKurusuna.ipa?v=$BUILD</string></dict>
              <dict><key>kind</key><string>display-image</string><key>url</key><string>https://emirhanduran27-lab.github.io/kurusu-kurusuna/icon.png</string></dict>
              <dict><key>kind</key><string>full-size-image</string><key>url</key><string>https://emirhanduran27-lab.github.io/kurusu-kurusuna/icon.png</string></dict>
            </array>
            <key>metadata</key><dict>
              <key>bundle-identifier</key><string>com.emirhanduran.kurusukurusuna</string>
              <key>bundle-version</key><string>$VERSION</string>
              <key>kind</key><string>software</string>
              <key>title</key><string>Kuruşu Kuruşuna</string>
            </dict>
          </dict></array></dict></plist>
          PLIST
          sed -i '' -E "s/iPhone test sürümü [^<]*/iPhone test sürümü $VERSION ($BUILD)/" docs/test/index.html
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test
          git commit -m "iPhone test sürümü $VERSION ($BUILD)"
          git push
          echo "::notice::Kurulum sayfası: https://emirhanduran27-lab.github.io/kurusu-kurusuna/test/"
