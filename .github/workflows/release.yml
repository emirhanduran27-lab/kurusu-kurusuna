name: Sürüm yayınla

# "v1.2.0" gibi bir etiket gönderildiğinde ya da elle çalıştırıldığında
# Windows, Mac ve Android kurulum dosyalarını derler, GitHub Releases'e yükler.
# iPhone sürümü App Store Connect'e (TestFlight) gönderilir.
# Program güncellemeleri buradan alır.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only_mac:
        description: Sadece Mac sürümünü derleyip mevcut sürüm sayfasına ekle
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !inputs.only_mac }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Derle ve yayınla (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kod imzalama sertifikası alındığında bu iki secret eklenir, imzalama kendiliğinden açılır
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --win nsis --publish always

  mac:
    # Aynı sürüm sayfasını iki iş birden oluşturmaya çalışmasın diye Windows'tan sonra çalışır
    needs: windows
    if: ${{ always() && (needs.windows.result == 'success' || inputs.only_mac) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Derle ve yayınla (Mac)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CSC_P12_BASE64: ${{ secrets.APPLE_CSC_P12_BASE64 }}
          APPLE_CSC_PASSWORD: ${{ secrets.APPLE_CSC_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_CSC_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            # Developer ID ile imzala ve Apple'a onaylat (notarization)
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            # electron-builder'ın kendi anahtar zinciri yeni macOS'ta açılamıyor, sertifikayı biz yüklüyoruz
            bash scripts/ci-mac-keychain.sh
            export CSC_NAME="EMIRHAN DURAN (77MQ2KKSS6)" APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            # Apple onayı uzun sürebiliyor. electron-builder 2 saatten eski sürüm sayfasına yüklemeyi atladığı için dosyaları biz yüklüyoruz
            npx electron-builder --mac --publish never
            VERSION=$(node -p "require('./package.json').version")
            gh release upload "v$VERSION" dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/*.zip.blockmap dist/latest-mac.yml --clobber
          else
            echo "::warning::Apple imza bilgileri yok, Mac sürümü imzasız derlendi"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish always -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false
          fi

      - name: İmzayı doğrula
        env:
          APPLE_CSC_P12_BASE64: ${{ secrets.APPLE_CSC_P12_BASE64 }}
        run: |
          [ -z "$APPLE_CSC_P12_BASE64" ] && exit 0
          APP=$(ls -d dist/mac-universal/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"

  ios:
    # iPhone sürümünü derleyip App Store Connect'e (TestFlight) yükler
    needs: windows
    runs-on: macos-latest
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Anahtar var mı?
        id: key
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::warning::Apple API anahtarı yok, iPhone sürümü yüklenmedi"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        if: steps.key.outputs.ok == 'true'

      - name: Apple ile giriş yeteneği
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: bash scripts/asc-capability.sh || echo "::warning::Apple ile giriş yeteneği açılamadı"

      - name: Derle ve TestFlight'a yükle
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: |
          set -o pipefail
          npx cap sync ios
          # Her yüklemenin numarası farklı olmalı
          BUILD=$(date -u +%Y%m%d%H%M)
          fail() { grep -iE "error|fail|invalid|denied|unable|provision|certificate" "$1" | tail -12 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          # Arşiv geçici imzayla alınır (izinler pakette kalır), asıl imza dışa aktarırken Apple'ın bulut imzasıyla atılır
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER= archive > "$RUNNER_TEMP/a.log" 2>&1 || fail "$RUNNER_TEMP/a.log"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/e.log" 2>&1 || fail "$RUNNER_TEMP/e.log"
          echo "::notice::iPhone sürümü App Store Connect'e yüklendi, birkaç dakika içinde TestFlight'ta görünür"

  android:
    # Sürüm sayfası Windows işinde oluşturulur, APK sonra eklenir
    needs: windows
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: İmza anahtarı var mı?
        id: key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret'ı yok, APK bu sürümde yayınlanmadı"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kurusu.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derle ve yayınla (Android)
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx cap sync android
          cd android
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/kurusu.jks" ANDROID_KEY_ALIAS=kurusu ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "../KurusuKurusuna-$VERSION-android.apk"
          cd ..
          gh release upload "v$VERSION" "KurusuKurusuna-$VERSION-android.apk" --clobber
