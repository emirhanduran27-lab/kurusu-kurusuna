name: Apple denemesi

# Yayın yapmadan Mac imzasını, Apple onayını ve iPhone derlemesini dener.
# Hata olursa son satırlar iş özetine not (annotation) olarak düşer.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: iPhone derlemesi TestFlight'a da yüklensin mi
        type: boolean
        default: false
      only:
        description: Sadece biri (mac, ios) ya da ikisi (all)
        type: string
        default: all

jobs:
  mac:
    if: inputs.only != 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mac imzala ve onaylat
        shell: bash
        env:
          APPLE_CSC_P12_BASE64: ${{ secrets.APPLE_CSC_P12_BASE64 }}
          APPLE_CSC_PASSWORD: ${{ secrets.APPLE_CSC_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -o pipefail
          echo "p12 uzunluk: ${#APPLE_CSC_P12_BASE64}, p8 satır: $(printf '%s' "$APPLE_API_KEY_P8" | wc -l), key id: ${#APPLE_API_KEY_ID}, issuer: ${#APPLE_API_ISSUER}"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          bash scripts/ci-mac-keychain.sh 2>&1 | tee "$RUNNER_TEMP/kc.log" || { tail -5 "$RUNNER_TEMP/kc.log" | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          export CSC_NAME="EMIRHAN DURAN (77MQ2KKSS6)" APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          if ! npx electron-builder --mac --publish never 2>&1 | tee "$RUNNER_TEMP/out.log"; then
            grep -iE "error|⨯|fail|invalid|denied|unable|not |status" "$RUNNER_TEMP/out.log" | tail -12 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          fi
          APP=$(ls -d dist/mac-universal/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -3
          spctl --assess --type execute --verbose "$APP" 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done

  ios:
    if: inputs.only != 'mac'
    runs-on: macos-latest
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: iPhone derle
        shell: bash
        env:
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -o pipefail
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          npx cap sync ios
          BUILD=$(date -u +%Y%m%d%H%M)
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$APPLE_API_KEY_ID" -authenticationKeyIssuerID "$APPLE_API_ISSUER")
          fail() { grep -iE "error|fail|invalid|denied|unable|no profiles|provision|certificate" "$1" | grep -v "^\s*$" | tail -12 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }
          # Arşiv imzasız alınır, App Store imzası dışa aktarırken Apple'ın bulut imzasıyla atılır (cihaz kaydı gerekmez)
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive > "$RUNNER_TEMP/a.log" 2>&1 || fail "$RUNNER_TEMP/a.log"
          echo "::notice::Arşiv tamam"
          DEST=export; [ "$UPLOAD" = "true" ] && DEST=upload
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/e.log" 2>&1 || fail "$RUNNER_TEMP/e.log"
          echo "::notice::Dışa aktarma tamam ($DEST)"
          if [ "$DEST" = export ]; then
            # Paketin imzalarını incele
            cd "$RUNNER_TEMP/export"; ls; mkdir x; cd x; unzip -q ../*.ipa
            APP=$(ls -d Payload/*.app)
            n() { echo "::notice::$*"; }
            n "app: $(codesign -dv "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier' | tr '\n' ' ')"
            n "verify: $(codesign --verify --deep --strict "$APP" 2>&1 | tail -2 | tr '\n' ' ') rc=$?"
            n "ent: $(codesign -d --entitlements - --xml "$APP" 2>/dev/null | tr -d '\n\t' | head -c 700)"
            security cms -D -i "$APP/embedded.mobileprovision" > prof.plist 2>/dev/null && n "profil: $(/usr/libexec/PlistBuddy -c 'Print :Name' prof.plist) / ProvisionsAllDevices=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' prof.plist 2>&1) / $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' prof.plist)"
            for f in "$APP"/Frameworks/*; do n "fw $(basename "$f"): $(codesign -dv "$f" 2>&1 | grep -E 'Authority=Apple Distribution|TeamIdentifier|not signed' | head -2 | tr '\n' ' ')"; done
            n "plist: $(/usr/libexec/PlistBuddy -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist" | tr -d '\n ') min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist") exe=$(lipo -info "$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" | sed 's/.*: //')"
          fi
